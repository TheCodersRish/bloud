<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloud Game Art</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050508;
        color: #e8e8ec;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bg {
        position: absolute;
        inset: -10%;
        background-size: cover;
        background-position: center;
        filter: blur(48px) saturate(1.35);
        opacity: 0.55;
        transform: scale(1.08);
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 0%,
          rgba(5, 5, 8, 0.35) 55%,
          rgba(5, 5, 8, 0.92) 100%
        );
      }
      .card {
        position: relative;
        z-index: 2;
        max-width: min(78vw, 960px);
        text-align: center;
        padding: 2rem;
      }
      .poster {
        width: min(62vw, 520px);
        aspect-ratio: 3 / 4;
        margin: 0 auto 1.5rem;
        border-radius: 18px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
        background: #111118 center / cover no-repeat;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      h1 {
        font-size: clamp(1.25rem, 2.4vw, 2rem);
        font-weight: 600;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.8);
      }
      p {
        margin-top: 0.75rem;
        opacity: 0.72;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bg" id="bg"></div>
      <div class="vignette"></div>
      <div class="card">
        <div class="poster" id="poster"></div>
        <h1 id="title">Now playing</h1>
        <p>Built-in display · Press M four times to exit the game</p>
      </div>
    </div>
    <script>
      window.updateArt = function (imageUrl, title) {
        const poster = document.getElementById("poster");
        const bg = document.getElementById("bg");
        const titleEl = document.getElementById("title");
        if (imageUrl) {
          const safe = String(imageUrl).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
          const css = 'url("' + safe + '")';
          poster.style.backgroundImage = css;
          bg.style.backgroundImage = css;
        }
        if (title) titleEl.textContent = title;
      };
    </script>
  </body>
</html>
